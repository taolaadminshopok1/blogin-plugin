# =====================================================
#  JOIN MESSAGES (shown one by one, 1 second apart)
# =====================================================
tin-nhap:
  - "&6&l✦ &e&lBLOGIN &6&l✦"
  - "&fWelcome &b{player}&f to the server!"
  - "&7Please log in with &a/login <password>"
  - "&7No account yet? Use &a/register <pw> <pw>"

# =====================================================
#  SYSTEM MESSAGES
# =====================================================
tin-nhan:
  da-dang-nhap: "&a✔ Successfully logged in! Welcome back, {player}!"
  da-dang-xuat: "&e👋 Logged out of your account!"
  dang-ky-thanh-cong: "&a✔ Account registered! You are now logged in automatically."
  sai-mat-khau: "&c❌ Wrong password! {remaining} attempt(s) left before you get locked."
  mat-khau-da-thay-doi: "&a✔ Password changed successfully!"
  tai-khoan-da-ton-tai: "&c❌ Account already exists! Use /login instead."
  chua-dang-ky: "&c❌ You don't have an account! Use /register <password> <password>."
  da-dang-nhap-roi: "&c⚠ You are already logged in!"
  chua-dang-nhap: "&c⚠ You are not logged in!"
  mat-khau-khong-khop: "&c❌ Password confirmation does not match!"
  mat-khau-qua-ngan: "&c❌ Password must be at least {min} characters long!"
  mat-khau-qua-dai: "&c❌ Password must not exceed {max} characters!"
  mat-khau-yeu: "&c❌ Password must contain upper case, lower case and digits!"
  bi-khoa: "&c⛔ Your account is locked! Try again in {time} seconds."
  het-thoi-gian: "&c⏰ Login time expired! You have been kicked from the server."
  canh-bao-thoi-gian: "&e⏰ {time} seconds left to log in!"
  loi-chung: "&c✖ Something went wrong, please try again!"
  su-dung-sai: "&cIncorrect usage!"
  sai-2fa: "&c❌ Incorrect 2FA code!"
  can-2fa: "&e🔐 This account requires a 2FA code. Use: /login <password> <6-digit code>"
  bat-2fa-thanh-cong: "&a✔ 2FA has been enabled for your account!"
  tat-2fa-thanh-cong: "&a✔ 2FA has been disabled for your account!"
  ip-blocked: "&c⛔ Your IP is temporarily blocked, please try again later!"
  qua-nhieu-lan-dang-nhap: "&c⛔ Your IP has reached the limit of {max} simultaneous login sessions!"
  admin-reset-mat-khau: "&eYour password was reset by an admin, please log in again."
  admin-xoa-tai-khoan: "&cYour account was deleted by an admin!"
  tu-dong-dang-nhap-ip: "&7🔒 &fAuto-login — your IP has been verified."
  admin-nhac-bat-2fa: "&e⏰ &7You are an admin — enable 2FA to protect your account: &a/2fa enable"

# =====================================================
#  WARNINGS WHILE NOT LOGGED IN
# =====================================================
canh-bao:
  chat: "&c⚠ You need to log in before chatting!"
  lenh: "&c⚠ Please log in first!"
  di-chuyen: "&c⚠ You can't move before logging in!"
  pha-khoi: "&c⚠ You can't break blocks before logging in!"
  tan-cong: "&c⚠ You can't attack before logging in!"
  tuong-tac: "&c⚠ You can't interact before logging in!"

# =====================================================
#  CAPTCHA
# =====================================================
captcha:
  tin-nhan-captcha: "&e[Captcha] &fPlease enter the code: &a&l{captcha}"
  tin-nhan-sai: "&c❌ Wrong captcha code! Use /captcha to get a new one"
  off: "&cCaptcha is currently disabled!"

# =====================================================
#  LOGIN GUI (CHEST GUI)
# =====================================================
gui:
  tieu-de: "&8✦ &6&lBLOGIN &8✦ &7| &f{player}"
  item:
    head:
      name: "&6&l✦ &e&lBLOGIN &6&l✦"
      lore:
        - "&7Hello, &f{player}&7!"
        - "&7Please log in to continue."
    info:
      name: "&e&lLOGIN INFO"
      lore:
        - "&7Account: &f{player}"
        - "&7IP: &f{ip}"
        - "&7Registered: &f{status}"
        - "&7Attempts left: &f{remaining}"
        - ""
        - "&8Passwords are stored with BCrypt"
    captcha:
      name: "&6&lCAPTCHA CODE"
      lore:
        - "&7Current code: &a&l{captcha}"
        - "&7Click to get a new code."
      lore-rong: "&7You don't have a captcha code yet."
      off-name: "&a&l✔ CAPTCHA SKIPPED"
      off-lore: "&7Captcha is disabled in the config."
    login:
      name: "&a&lLOG IN"
      lore:
        - "&7Click to confirm your login"
        - ""
        - "&7Password entered: &f{chuc}"
        - "&72FA: &f{tfa}"
        - "&7Captcha: &f{cap}"
        - ""
        - "&eShift + Click to close"
    help:
      name: "&b&lHELP"
      lore:
        - "&7Click &f< password slot > &7to enter your password"
        - "&7Click &f< 2FA slot > &7to enter your 2FA code (if enabled)"
        - "&7Click the green button to log in"
        - ""
        - "&7Or use the command &a/login <password>"
    password:
      name: "&e&lPASSWORD SLOT"
      lore:
        - "&7Click to enter your password"
        - ""
        - "&8Current: &7{chuc}"
    totp:
      name: "&d&l2FA CODE SLOT"
      lore:
        - "&7Click to enter your 6-digit code"
        - ""
        - "&8Current: &7{tfa}"
    close:
      name: "&c&lCLOSE"
      lore:
        - "&7Close this panel"
  prompt:
    password: "&eType your password in chat (type &f/cancel &eto abort):"
    totp: "&dType your 2FA code in chat (type &f/cancel &dto abort):"
    captcha: "&6Type the captcha code &7(&f{captcha}&7) in chat &8(type &f/cancel &8to abort):"
  hint:
    captcha-click: "&7Click the captcha slot above for a new code, or use &a/captcha"
    timeout-reopen: "&7Input timed out, the panel has been reopened."
    chua-nhap-mat-khau: "&c✖ Please enter your password first!"
    da-dang-nhap-roi: "&cYou are already logged in!"
    dang-ky-ngay: "&7Register now: &a/register <password> <confirm password>"
  value:
    co: "Yes"
    khong: "No"
    chua-nhap: "Not entered"
    khong-co: "None"
    chua-co: "None"

# =====================================================
#  PLAYER COMMANDS
# =====================================================
commands:
  chi-choi: "&cThis command is for players only!"
  login:
    usage: "&cUsage: /login <password> [2FA code]"
    captcha-usage: "&7Syntax: &f/login <captcha> <password> [2FA code]"
  register:
    usage: "&cUsage: /register <password> <confirm password>"
    captcha-usage: "&cUsage: /register <captcha> <password> <confirm password>"
  changepassword:
    usage: "&cUsage: /changepassword <old password> <new password>"
  captcha:
    off: "&cCaptcha is currently disabled!"
  gui:
    off: "&cThe login GUI is disabled in the config!"
    use-login: "&7Use the command: &f/login <password>"
  logout:
    not-logged-in: "&c⚠ You are not logged in!"
  2fa:
    off: "&c2FA is currently disabled in the config!"
    not-authenticated: "&c⚠ You need to log in first!"
    setup-header: "&6&l═══════ 2FA Setup &6&l═══════"
    setup-huong-dan: "&eScan the QR code or enter the secret key manually in Google Authenticator:"
    setup-secret: "&aSecret: &f{secret}"
    setup-buoc-2: "&eOnce added, enter the current code:"
    setup-lenh: "&a/2fa confirm <{digits}-digit code>"
    setup-otpauth: "&7otpauth URL: &f{url}"
    setup-luu-y: "&8Note: the secret is stored AES-GCM encrypted in the database."
    setup-footer: "&6&l═══════════════════════════════"
    confirm-usage: "&cUsage: /2fa confirm <6-digit code>"
    disable-usage: "&cUsage: /2fa disable <current 6-digit code>"
    status-header: "&6&l═══════ 2FA Status &6&l═══════"
    status-label: "&eStatus: "
    status-on: "&a✔ Enabled"
    status-off: "&c✘ Disabled"
    status-footer: "&6&l═══════════════════════════════"
    help-header: "&6&l═══════ 2FA Commands &6&l═══════"
    help-enable: "&e/2fa enable &7- Enable 2FA"
    help-confirm: "&e/2fa confirm <code> &7- Confirm enabling"
    help-disable: "&e/2fa disable <code> &7- Disable 2FA"
    help-status: "&e/2fa status &7- View status"
    help-footer: "&6&l═══════════════════════════════"

