      name: "&a&lSE CONNECTER"
      lore:
        - "&7Cliquez pour confirmer la connexion"
        - ""
        - "&7Mot de passe saisi : &f{chuc}"
        - "&72FA : &f{tfa}"
        - "&7Captcha : &f{cap}"
        - ""
        - "&eMaj + clic pour fermer"
