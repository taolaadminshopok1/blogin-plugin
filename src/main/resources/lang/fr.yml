      name: "&e&lCASE MOT DE PASSE"
      lore:
        - "&7Cliquez pour saisir votre mot de passe"
        - ""
        - "&8Actuel : &7{chuc}"
    totp:
      name: "&d&lCASE CODE 2FA"
      lore:
        - "&7Cliquez pour saisir le code à 6 chiffres"
        - ""
        - "&8Actuel : &7{tfa}"
    close:
      name: "&c&lFERMER"
      lore:
        - "&7Fermer ce panneau"
