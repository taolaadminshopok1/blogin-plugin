gui:
  tieu-de: "&8✦ &6&lBLOGIN &8✦ &7| &f{player}"
  item:
    head:
      name: "&6&l✦ &e&lBLOGIN &6&l✦"
      lore:
        - "&7Olá, &f{player}&7!"
        - "&7Inicie sessão para continuar."
    info:
      name: "&e&lINFORMAÇÕES DE SESSÃO"
      lore:
        - "&7Conta: &f{player}"
        - "&7IP: &f{ip}"
        - "&7Registada: &f{status}"
        - "&7Tentativas restantes: &f{remaining}"
        - ""
        - "&8As palavras-passe são guardadas com BCrypt"
    captcha:
      name: "&6&lCÓDIGO CAPTCHA"
      lore:
        - "&7Código atual: &a&l{captcha}"
        - "&7Clique para obter um novo código."
      lore-rong: "&7Ainda não tem um código captcha."
      off-name: "&a&l✔ CAPTCHA IGNORADO"
      off-lore: "&7O captcha está desativado na configuração."
    login:
      name: "&a&lINICIAR SESSÃO"
      lore:
        - "&7Clique para confirmar a sessão"
        - ""
        - "&7Palavra-passe introduzida: &f{chuc}"
        - "&72FA: &f{tfa}"
        - "&7Captcha: &f{cap}"
        - ""
        - "&eShift + clique para fechar"
    help:
      name: "&b&lAJUDA"
      lore:
        - "&7Clique em &f< espaço de senha > &7para introduzir a palavra-passe"
        - "&7Clique em &f< espaço 2FA > &7para o código 2FA (se ativado)"
        - "&7Clique no botão verde para iniciar sessão"
        - ""
        - "&7Ou use o comando &a/login <palavra-passe>"
    password:
      name: "&e&lESPAÇO DE PALAVRA-PASSE"
      lore:
        - "&7Clique para introduzir a palavra-passe"
        - ""
        - "&8Atual: &7{chuc}"
    totp:
      name: "&d&lESPAÇO DE CÓDIGO 2FA"
      lore:
        - "&7Clique para introduzir o código de 6 dígitos"
        - ""
        - "&8Atual: &7{tfa}"
    close:
      name: "&c&lFECHAR"
      lore:
        - "&7Fechar este painel"
  prompt:
    password: "&eEscreva a palavra-passe no chat (escreva &f/cancel &epara cancelar):"
    totp: "&dEscreva o código 2FA no chat (escreva &f/cancel &dpara cancelar):"
    captcha: "&6Escreva o código captcha &7(&f{captcha}&7) no chat &8(escreva &f/cancel &8para cancelar):"
