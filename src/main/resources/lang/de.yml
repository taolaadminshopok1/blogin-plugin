      off-lore: "&7Captcha ist in der Konfiguration deaktiviert."
    login:
      name: "&a&lEINLOGGEN"
      lore:
        - "&7Klicken, um die Anmeldung zu bestätigen"
        - ""
        - "&7Eingegebenes Passwort: &f{chuc}"
        - "&72FA: &f{tfa}"
        - "&7Captcha: &f{cap}"
        - ""
        - "&eShift + Klick zum Schließen"
    help:
      name: "&b&lHILFE"
      lore:
        - "&7Klicke auf &f< Passwort-Slot > &7um dein Passwort einzugeben"
        - "&7Klicke auf &f< 2FA-Slot > &7für den 2FA-Code (falls aktiviert)"
        - "&7Klicke auf den grünen Button zum Einloggen"
        - ""
        - "&7Oder nutze den Befehl &a/login <Passwort>"
    password:
      name: "&e&lPASSWORT-SLOT"
      lore:
        - "&7Klicken, um dein Passwort einzugeben"
        - ""
        - "&8Aktuell: &7{chuc}"
    totp:
      name: "&d&l2FA-CODE-SLOT"
      lore:
        - "&7Klicken, um den 6-stelligen Code einzugeben"
        - ""
        - "&8Aktuell: &7{tfa}"
    close:
      name: "&c&lSCHLIESSEN"
      lore:
        - "&7Dieses Panel schließen"
  prompt:
    password: "&eGib dein Passwort im Chat ein (tippe &f/cancel &ezum Abbrechen):"
    totp: "&dGib deinen 2FA-Code im Chat ein (tippe &f/cancel &dzum Abbrechen):"
