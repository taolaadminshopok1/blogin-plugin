      name: "&d&lСЛОТ КОДА 2FA"
      lore:
        - "&7Нажмите, чтобы ввести 6-значный код"
        - ""
        - "&8Сейчас: &7{tfa}"
    close:
      name: "&c&lЗАКРЫТЬ"
      lore:
        - "&7Закрыть эту панель"
