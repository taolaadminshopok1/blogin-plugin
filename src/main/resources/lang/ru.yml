      name: "&a&lВОЙТИ"
      lore:
        - "&7Нажмите, чтобы подтвердить вход"
        - ""
        - "&7Введённый пароль: &f{chuc}"
        - "&72FA: &f{tfa}"
        - "&7Капча: &f{cap}"
        - ""
        - "&eShift + клик, чтобы закрыть"
