# =====================================================
#  GIAO DIỆN ĐĂNG NHẬP (CHEST GUI)
# =====================================================
gui:
  tieu-de: "&8✦ &6&lBLOGIN &8✦ &7| &f{player}"
  item:
    head:
      name: "&6&l✦ &e&lBLOGIN &6&l✦"
      lore:
        - "&7Xin chào, &f{player}&7!"
        - "&7Vui lòng đăng nhập để tiếp tục."
    info:
      name: "&e&lTHÔNG TIN ĐĂNG NHẬP"
      lore:
        - "&7Tài khoản: &f{player}"
        - "&7IP: &f{ip}"
        - "&7Đã đăng ký: &f{status}"
        - "&7Số lần thử còn lại: &f{remaining}"
        - ""
        - "&8Mật khẩu được lưu dạng BCrypt"
    captcha:
      name: "&6&lMÃ CAPTCHA"
      lore:
        - "&7Mã hiện tại: &a&l{captcha}"
        - "&7Nhấn để lấy mã mới."
      lore-rong: "&7Bạn chưa có mã captcha."
      off-name: "&a&l✔ CAPTCHA ĐÃ ĐƯỢC BỎ QUA"
      off-lore: "&7Captcha đang tắt trong cấu hình."
    login:
      name: "&a&lĐĂNG NHẬP"
      lore:
        - "&7Nhấn để xác nhận đăng nhập"
        - ""
        - "&7Mật khẩu đã nhập: &f{chuc}"
        - "&72FA: &f{tfa}"
        - "&7Captcha: &f{cap}"
        - ""
        - "&eNhấn Shift + Click để đóng"
    help:
      name: "&b&lHƯỚNG DẪN"
      lore:
        - "&7Vào &f< ô mật khẩu > &7để nhập mật khẩu"
        - "&7Vào &f< ô 2FA > &7để nhập mã 2FA (nếu có)"
        - "&7Nhấn nút xanh lá để đăng nhập"
        - ""
        - "&7Hoặc dùng lệnh &a/login <mật khẩu>"
    password:
      name: "&e&lÔ NHẬP MẬT KHẨU"
      lore:
        - "&7Nhấn để nhập mật khẩu"
        - ""
        - "&8Hiện tại: &7{chuc}"
    totp:
      name: "&d&lÔ NHẬP MÃ 2FA"
      lore:
        - "&7Nhấn để nhập mã 6 số"
        - ""
        - "&8Hiện tại: &7{tfa}"
    close:
      name: "&c&lĐÓNG"
      lore:
        - "&7Đóng panel"
  prompt:
    password: "&eNhập mật khẩu trong chat (gõ &f/cancel &eđể huỷ):"
    totp: "&dNhập mã 2FA trong chat (gõ &f/cancel &dđể huỷ):"
    captcha: "&6Nhập mã captcha &7(&f{captcha}&7) trong chat &8(gõ &f/cancel &8để huỷ):"
